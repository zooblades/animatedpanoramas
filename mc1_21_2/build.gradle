plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+mc1.21.2-1.21.10"
group = project.maven_group
base { archivesName = project.archives_base_name }

// The shared overlay code is written with the 1.21.11+ class name "Identifier".
// Before 1.21.11 that class is called "ResourceLocation" (same class, renamed), so rename it while copying.
def generateLegacyOverlay = tasks.register('generateLegacyOverlay', Copy) {
    from('../common/java') {
        filter { String line -> line.replaceAll('\\bIdentifier\\b', 'ResourceLocation') }
    }
    into layout.buildDirectory.dir('generated/legacy-overlay')
}

sourceSets {
    main {
        java { srcDir generateLegacyOverlay }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  mc1_21_1:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mc1_21_1 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: animated-panorama-mc1.21.1
          path: mc1_21_1/build/libs/*[0-9].jar

  mc1_21_11:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mc1_21_11 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.1" }
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: animated-panorama-mc1.21.11
          path: mc1_21_11/build/libs/*[0-9].jar

  # One jar for 26.1 - 26.3. Compiled against 26.1.2 (artifact),
  # and also compiled against 26.2 and 26.3 to prove the same code builds on all of them.
  mc26:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.1.2", api: "0.155.3+26.1.2", upload: true }
          - { mc: "26.2",   api: "0.161.0+26.2",   upload: false }
          - { mc: "26.3",   api: "0.162.0+26.3",   upload: false }
    defaults: { run: { working-directory: mc26 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.1" }
      - run: gradle build -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.api }}
      - if: ${{ matrix.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: animated-panorama-mc26.1-26.3
          path: mc26/build/libs/*[0-9].jar
